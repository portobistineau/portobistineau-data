name: Refresh Moon Image URLs

on:
  # Runs manually when needed
  workflow_dispatch:
  # Runs every Sunday at 00:00 UTC
  schedule:
    - cron: '0 0 * * 0' 

jobs:
  build-urls:
    runs-on: ubuntu-latest
    # 💥 ADD THIS PERMISSIONS BLOCK HERE 💥
    permissions:
      contents: write # Grants the action permission to write (commit and push) files
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (No external libraries needed for this script!)
        run: echo "No dependencies to install."

      - name: Run URL generation script
        run: python build_moon_urls.py
      
      - name: Commit and Push new JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Automated: Refresh Moon URL cache (GitHub Actions)'
          files: moon_urls.json
          # Ensure the Git email matches your GitHub email for clean commits
